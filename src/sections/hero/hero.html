<section id="hero" class="hero" data-section="hero">
  <!--
    Full-bleed band (ticket 122): the hero is NOT one of the bordered table
    cells and takes no section number (About keeps 01). Its height ends at the
    fold so the ticker band starts there; the inner column keeps the 1280 +
    2rem content frame every section uses.
  -->

  <!--
    Backdrop (ticket 118; recoloured + turned for ticket 123): the measured
    inspiration's dynamic head — thin concentric rings plus the floating
    skill-logo chips (13 simple-icons glyphs, local assets, each masked onto its
    own brand colour). Decorative end to end: aria-hidden, no pointers, and
    geometry 100% token-driven. Full-bleed since 122 (the hero itself is full
    width), so the rings/chips crop at the viewport edge like the inspiration's.
    .hero__orbit turns the whole group as one wheel; the per-frame angle and each
    ring's own spin are CSS math off the --hero-scroll counter
    (src/sections/hero/hero.js); with JS off or reduced motion the counter never
    publishes and the backdrop sits exactly at rest.
  -->
  <div class="hero__backdrop" aria-hidden="true">
    <div class="hero__orbit">
      <span class="hero__ring hero__ring--1"></span>
      <span class="hero__ring hero__ring--2"></span>
      <span class="hero__ring hero__ring--3"></span>
      <span class="hero__chip" data-chip="docker"></span>
      <span class="hero__chip" data-chip="kubernetes"></span>
      <span class="hero__chip" data-chip="python"></span>
      <span class="hero__chip" data-chip="linux"></span>
      <span class="hero__chip" data-chip="github"></span>
      <span class="hero__chip" data-chip="git"></span>
      <span class="hero__chip" data-chip="terraform"></span>
      <span class="hero__chip" data-chip="mysql"></span>
      <span class="hero__chip" data-chip="grafana"></span>
      <span class="hero__chip" data-chip="nginx"></span>
      <span class="hero__chip" data-chip="flask"></span>
      <span class="hero__chip" data-chip="ansible"></span>
      <span class="hero__chip" data-chip="prometheus"></span>
    </div>
  </div>

  <div class="hero__column">
    <!-- Above the fold: name + tagline + GitHub CTA + mono meta + the scroll cue
         (ticket 118). All copy is dict-bound; the meta row reuses
         contact.location. The name's characters are split into chrome spans by
         src/intro/intro.js during the load intro (ticket 122); the element's
         text is never replaced. -->
    <div class="hero__head">
      <h1 class="hero__name" data-i18n="hero.name"></h1>
      <p class="hero__tagline" data-i18n="hero.tagline"></p>
      <p class="hero__cta-row">
        <a class="hero__cta" href="https://github.com/Khalil-bec" target="_blank" rel="noopener noreferrer"><span data-i18n="hero.cta"></span><span class="hero__cta-arrow" aria-hidden="true"></span><span class="visually-hidden" data-i18n="a11y.newTab"></span></a>
      </p>
      <p class="hero__meta">
        <span data-i18n="contact.location"></span>
        <span class="hero__meta-sep" aria-hidden="true"></span>
        <span data-i18n="hero.role"></span>
      </p>
      <span class="hero__cue" aria-hidden="true"></span>
    </div>
  </div>

</section>
