<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Literal name = the no-JS / pre-boot fallback (data, not marketing copy);
         ticket 004 rebinds it from the `meta.title` key. -->
    <title data-i18n="meta.title">Mohamed Khalil Becheikh</title>

    <!--
      Scaffold note (ticket 001) — authoring-time partial inlining.
      src/sections/<name>/<name>.html is the authoritative source for a section.
      The <section> elements in <main> below are those partials inlined BY HAND.
      There is no build step and no runtime fetch; keep the partial and its inlined
      copy in sync whenever a section is edited.

      Stylesheet order (load order): lenis (vendor utility) -> tokens -> base ->
      nav (ticket 004) -> section css (document order, hero -> contact) ->
      motion (numbering, reveal, ticker shell from ticket 003). The vendor sheet
      only styles Lenis' own hooks; it does not compete with the tokens.

      Scripts: vendored classic libs (UMD globals) are loaded, deferred, before
      the single ES-module entry (src/main.js) — gsap -> ScrollTrigger -> lenis.
      ScrollTrigger needs `gsap` to register itself, and ticket 003's bridge wires
      Lenis into ScrollTrigger, so this order matters. Deferred classics run in
      document order ahead of the module, so the globals exist by execution time.
    -->

    <link rel="stylesheet" href="vendor/lenis-1.3.27.min.css" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/nav/nav.css" />
    <link rel="stylesheet" href="src/sections/hero/hero.css" />
    <link rel="stylesheet" href="src/sections/projects/projects.css" />
    <link rel="stylesheet" href="src/sections/skills/skills.css" />
    <link rel="stylesheet" href="src/sections/education/education.css" />
    <link rel="stylesheet" href="src/sections/contact/contact.css" />
    <link rel="stylesheet" href="src/styles/motion.css" />
  </head>
  <body>
    <!-- inlined from src/nav/nav.html -->
    <nav class="nav" data-i18n-attr="aria-label=nav.aria">
      <ul class="nav__list">
        <li class="nav__item"><a class="nav__link" href="#hero" data-i18n="nav.hero"></a></li>
        <li class="nav__item"><a class="nav__link" href="#projects" data-i18n="nav.projects"></a></li>
        <li class="nav__item"><a class="nav__link" href="#skills" data-i18n="nav.skills"></a></li>
        <li class="nav__item"><a class="nav__link" href="#education" data-i18n="nav.education"></a></li>
        <li class="nav__item"><a class="nav__link" href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="lang-switch" data-lang-switch role="group" data-i18n-attr="aria-label=lang.group">
        <button class="lang-switch__button" type="button" data-lang="en" aria-pressed="false" data-i18n="lang.en"></button>
        <button class="lang-switch__button" type="button" data-lang="fr" aria-pressed="false" data-i18n="lang.fr"></button>
      </div>
    </nav>

    <main id="main">
      <!-- inlined from src/sections/hero/hero.html -->
      <section id="hero" class="section section--hero" data-section="hero">
        <span class="section__index" aria-hidden="true"></span>
      </section>

      <!-- inlined from src/sections/projects/projects.html -->
      <section id="projects" class="section section--projects" data-section="projects">
        <span class="section__index" aria-hidden="true"></span>
      </section>

      <!-- inlined from src/sections/skills/skills.html -->
      <section id="skills" class="section section--skills" data-section="skills">
        <span class="section__index" aria-hidden="true"></span>
      </section>

      <!-- inlined from src/sections/education/education.html -->
      <section id="education" class="section section--education" data-section="education">
        <span class="section__index" aria-hidden="true"></span>
      </section>

      <!-- inlined from src/sections/contact/contact.html -->
      <section id="contact" class="section section--contact" data-section="contact">
        <span class="section__index" aria-hidden="true"></span>
      </section>
    </main>

    <!--
      Ticker shell (ticket 003). The source element carries the i18n key (bound in
      ticket 004); with JS off or under reduced motion it stays a plain, readable,
      in-flow line. JS clones it into an aria-hidden marquee pinned to the bottom.
    -->
    <div class="ticker" data-ticker>
      <div class="ticker__track" data-ticker-track></div>
      <span class="ticker__item" data-ticker-source data-i18n="hero.tagline" data-i18n-mode="text"></span>
    </div>

    <!-- Vendor classic scripts (UMD globals), deferred; then the module entry. -->
    <script defer src="vendor/gsap-3.15.0.min.js"></script>
    <script defer src="vendor/ScrollTrigger-3.15.0.min.js"></script>
    <script defer src="vendor/lenis-1.3.27.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
