<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Literal name = the no-JS / pre-boot fallback (data, not marketing copy);
         ticket 004 rebinds it from the `meta.title` key. -->
    <title data-i18n="meta.title">Mohamed Khalil Becheikh</title>

    <!-- Brand assets (ticket 005): code-drawn KB monogram. Favicon ships as SVG
         (crisp) with an ICO fallback for the browser's unprompted /favicon.ico
         request. Open Graph gets the monogram image + title now; og:url is
         omitted until the site is hosted (it needs an absolute https URL —
         never localhost). TODO(host): add og:url + absolute og:image. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="alternate icon" href="favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" />
    <!-- Preload both dictionaries (ticket 104): the hero text — the LCP
         element — cannot paint before they arrive, so fetch them in parallel
         with the parse instead of after module evaluation. Static, local,
         no build step. -->
    <link rel="preload" href="src/i18n/en.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <link rel="preload" href="src/i18n/fr.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohamed Khalil Becheikh" />
    <meta property="og:image" content="og-image.png" />

    <!--
      Scaffold note (ticket 001) — authoring-time partial inlining.
      src/sections/<name>/<name>.html is the authoritative source for a section.
      The <section> elements in <main> below are those partials inlined BY HAND.
      There is no build step and no runtime fetch; keep the partial and its inlined
      copy in sync whenever a section is edited.

      Stylesheet order (load order): lenis (vendor utility) -> tokens -> base ->
      nav (ticket 004) -> section css (document order, hero -> contact) ->
      motion (numbering, reveal, ticker shell from ticket 003) ->
      ruler (fixed overlay, ticket 102). The rail that followed (tickets
      103/108) was retired in ticket 112 — the section list it duplicated is
      carried by the nav's mono links until the fixed name layer (114).
      The vendor sheet
      only styles Lenis' own hooks; it does not compete with the tokens.

      Scripts: vendored classic libs (UMD globals) are loaded, deferred, before
      the single ES-module entry (src/main.js) — gsap -> ScrollTrigger -> lenis.
      ScrollTrigger needs `gsap` to register itself, and ticket 003's bridge wires
      Lenis into ScrollTrigger, so this order matters. Deferred classics run in
      document order ahead of the module, so the globals exist by execution time.
    -->

    <link rel="stylesheet" href="vendor/lenis-1.3.27.min.css" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/nav/nav.css" />
    <link rel="stylesheet" href="src/sections/hero/hero.css" />
    <link rel="stylesheet" href="src/sections/projects/projects.css" />
    <link rel="stylesheet" href="src/sections/skills/skills.css" />
    <link rel="stylesheet" href="src/sections/education/education.css" />
    <link rel="stylesheet" href="src/sections/contact/contact.css" />
    <link rel="stylesheet" href="src/styles/motion.css" />
    <link rel="stylesheet" href="src/ruler/ruler.css" />
  </head>
  <body>
    <!-- Static no-JS notice (ticket 102, sanctioned chrome): the ruler driver
         is JS, so without it the hidden native bar leaves no way to scroll. -->
    <noscript>
      <p class="noscript-notice">
        <span class="noscript-notice__line">This portfolio needs JavaScript to scroll — please enable it.</span>
        <span class="noscript-notice__line">Ce portfolio nécessite JavaScript pour défiler — veuillez l'activer.</span>
      </p>
    </noscript>

    <!-- inlined from src/nav/nav.html -->
    <nav class="nav" data-i18n-attr="aria-label=nav.aria">
      <ul class="nav__list">
        <li class="nav__item"><a class="nav__link" href="#hero" data-i18n="nav.hero"></a></li>
        <li class="nav__item"><a class="nav__link" href="#projects" data-i18n="nav.projects"></a></li>
        <li class="nav__item"><a class="nav__link" href="#skills" data-i18n="nav.skills"></a></li>
        <li class="nav__item"><a class="nav__link" href="#education" data-i18n="nav.education"></a></li>
        <li class="nav__item"><a class="nav__link" href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="lang-switch" data-lang-switch role="group" data-i18n-attr="aria-label=lang.group">
        <button class="lang-switch__button" type="button" data-lang="en" aria-pressed="false" data-i18n="lang.en"></button>
        <button class="lang-switch__button" type="button" data-lang="fr" aria-pressed="false" data-i18n="lang.fr"></button>
      </div>
    </nav>

    <main id="main">
      <!-- inlined from src/sections/hero/hero.html -->
      <section id="hero" class="section section--hero" data-section="hero">
        <span class="section__index" aria-hidden="true"><span class="section__num"></span><span class="section__name" data-i18n="nav.hero"></span></span>

        <!-- Above the fold: name + tagline + a decorative scroll cue. -->
        <div class="hero__head">
          <h1 class="hero__name" data-i18n="hero.name"></h1>
          <p class="hero__tagline" data-i18n="hero.tagline"></p>
          <span class="hero__cue" aria-hidden="true"></span>
        </div>

        <!-- Below the fold: about paragraphs + human languages + reserved portrait. -->
        <div class="hero__about">
          <h2 class="hero__about-title" data-i18n="hero.aboutTitle"></h2>
          <div class="hero__about-grid">
            <div class="hero__about-body">
              <p data-reveal data-i18n="hero.about[0]"></p>
              <p data-reveal data-i18n="hero.about[1]"></p>
              <p data-reveal data-i18n="hero.about[2]"></p>
              <p class="hero__languages" data-reveal data-i18n="hero.languages"></p>
            </div>
            <div class="hero__portrait image-slot" aria-hidden="true" data-reveal></div>
          </div>
        </div>
      </section>

      <!--
        Ticker band (tickets 003/101). In-flow directly under the hero; it
        scrolls away with the page. The source element carries the i18n key
        (bound in ticket 004); with JS off or under reduced motion it stays a
        plain, readable, static line. JS clones the source into an aria-hidden
        marquee.
      -->
      <div class="ticker" data-ticker>
        <div class="ticker__track" data-ticker-track></div>
        <span class="ticker__item" data-ticker-source data-i18n="hero.tagline" data-i18n-mode="text"></span>
      </div>

      <!-- inlined from src/sections/projects/projects.html -->
      <section id="projects" class="section section--projects" data-section="projects">
        <span class="section__index" aria-hidden="true"><span class="section__num"></span><span class="section__name" data-i18n="projects.title"></span></span>
        <h2 class="section__title" data-i18n="projects.title"></h2>

        <!-- Three projects, every bullet visible (no collapse/expand). Repo URLs are
             data and live here; the copy (name/summary/stack/why/bullets/note) comes
             from the dictionaries. Each card reserves an empty 16:10 screenshot slot
             (anti-CLS; the screenshot itself is supplied later). -->
        <ul class="projects__list">
          <li class="project" data-reveal>
            <div class="project__body">
              <h3 class="project__name">
                <a class="project__link" href="https://github.com/Khalil-bec/Homelab" target="_blank" rel="noopener noreferrer"><span data-i18n="projects.items[0].name"></span><span class="visually-hidden" data-i18n="a11y.newTab"></span></a>
              </h3>
              <p class="project__summary" data-i18n="projects.items[0].summary"></p>
              <p class="project__meta">
                <span class="project__label" data-i18n="projects.items[0].stackLabel"></span>
                <span class="project__value" data-i18n="projects.items[0].stack"></span>
              </p>
              <ul class="project__bullets">
                <li data-i18n="projects.items[0].bullets[0]"></li>
                <li data-i18n="projects.items[0].bullets[1]"></li>
                <li data-i18n="projects.items[0].bullets[2]"></li>
                <li data-i18n="projects.items[0].bullets[3]"></li>
              </ul>
            </div>
            <div class="project__slot image-slot" aria-hidden="true"></div>
          </li>

          <li class="project" data-reveal>
            <div class="project__body">
              <h3 class="project__name">
                <a class="project__link" href="https://github.com/Khalil-bec/gymtrack" target="_blank" rel="noopener noreferrer"><span data-i18n="projects.items[1].name"></span><span class="visually-hidden" data-i18n="a11y.newTab"></span></a>
              </h3>
              <p class="project__summary" data-i18n="projects.items[1].summary"></p>
              <p class="project__meta">
                <span class="project__label" data-i18n="projects.items[1].stackLabel"></span>
                <span class="project__value" data-i18n="projects.items[1].stack"></span>
              </p>
              <ul class="project__bullets">
                <li data-i18n="projects.items[1].bullets[0]"></li>
                <li data-i18n="projects.items[1].bullets[1]"></li>
                <li data-i18n="projects.items[1].bullets[2]"></li>
                <li data-i18n="projects.items[1].bullets[3]"></li>
                <li data-i18n="projects.items[1].bullets[4]"></li>
              </ul>
              <p class="project__note" data-i18n="projects.items[1].note"></p>
            </div>
            <div class="project__slot image-slot" aria-hidden="true"></div>
          </li>

          <li class="project" data-reveal>
            <div class="project__body">
              <h3 class="project__name">
                <a class="project__link" href="https://github.com/Khalil-bec/ksh" target="_blank" rel="noopener noreferrer"><span data-i18n="projects.items[2].name"></span><span class="visually-hidden" data-i18n="a11y.newTab"></span></a>
                <code class="project__alias" data-i18n="projects.items[2].alias"></code>
              </h3>
              <p class="project__summary" data-i18n="projects.items[2].summary"></p>
              <p class="project__meta">
                <span class="project__label" data-i18n="projects.items[2].whyLabel"></span>
                <span class="project__value" data-i18n="projects.items[2].why"></span>
              </p>
              <ul class="project__bullets">
                <li data-i18n="projects.items[2].bullets[0]"></li>
                <li data-i18n="projects.items[2].bullets[1]"></li>
                <li data-i18n="projects.items[2].bullets[2]"></li>
                <li data-i18n="projects.items[2].bullets[3]"></li>
                <li data-i18n="projects.items[2].bullets[4]"></li>
                <li data-i18n="projects.items[2].bullets[5]"></li>
              </ul>
            </div>
            <div class="project__slot image-slot" aria-hidden="true"></div>
          </li>
        </ul>
      </section>

      <!-- inlined from src/sections/skills/skills.html -->
      <section id="skills" class="section section--skills" data-section="skills">
        <span class="section__index" aria-hidden="true"><span class="section__num"></span><span class="section__name" data-i18n="skills.title"></span></span>
        <h2 class="section__title" data-i18n="skills.title"></h2>

        <!-- Four glanceable tiers (Core / Hands-on / Academic / Currently learning).
             Items live in the dictionaries as arrays, so each renders as a chip with
             no JS. The Academic coursework note is preserved verbatim. -->

          <li class="skills__tier" data-reveal>
            <h3 class="skills__tier-title" data-i18n="skills.tiers[0].title"></h3>
            <ul class="skills__items">
              <li class="skills__item" data-i18n="skills.tiers[0].items[0]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[1]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[2]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[3]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[4]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[5]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[6]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[7]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[8]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[9]"></li>
              <li class="skills__item" data-i18n="skills.tiers[0].items[10]"></li>
            </ul>
          </li>

          <li class="skills__tier" data-reveal>
            <h3 class="skills__tier-title" data-i18n="skills.tiers[1].title"></h3>
            <ul class="skills__items">
              <li class="skills__item" data-i18n="skills.tiers[1].items[0]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[1]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[2]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[3]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[4]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[5]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[6]"></li>
              <li class="skills__item" data-i18n="skills.tiers[1].items[7]"></li>
            </ul>
          </li>

          <li class="skills__tier" data-reveal>
            <h3 class="skills__tier-title" data-i18n="skills.tiers[2].title"></h3>
            <ul class="skills__items">
              <li class="skills__item" data-i18n="skills.tiers[2].items[0]"></li>

            <p class="skills__note" data-i18n="skills.tiers[2].note"></p>
          </li>

          <li class="skills__tier" data-reveal>
            <h3 class="skills__tier-title" data-i18n="skills.tiers[3].title"></h3>
            <ul class="skills__items">
              <li class="skills__item" data-i18n="skills.tiers[3].items[0]"></li>
              <li class="skills__item" data-i18n="skills.tiers[3].items[1]"></li>
              <li class="skills__item" data-i18n="skills.tiers[3].items[2]"></li>
            </ul>
          </li>
        </ul>
      </section>

      <!-- inlined from src/sections/education/education.html -->
      <section id="education" class="section section--education" data-section="education">
        <span class="section__index" aria-hidden="true"><span class="section__num"></span><span class="section__name" data-i18n="education.title"></span><span class="section__meta" data-i18n="education.graduation"></span></span>
        <h2 class="section__title" data-i18n="education.title"></h2>

        <div class="education__entry" data-reveal>
          <h3 class="education__school" data-i18n="education.school"></h3>
          <p class="education__location" data-i18n="education.location"></p>
          <p class="education__degree" data-i18n="education.degree"></p>
          <p class="education__graduation" data-i18n="education.graduation"></p>
        </div>
      </section>

      <!-- inlined from src/sections/contact/contact.html -->
      <section id="contact" class="section section--contact" data-section="contact">
        <span class="section__index" aria-hidden="true"><span class="section__num"></span><span class="section__name" data-i18n="contact.title"></span><span class="section__meta" data-i18n="contact.location"></span></span>
        <h2 class="section__title" data-i18n="contact.title"></h2>

        <!-- Labels come from the dictionaries; the addresses/URLs are data and live
             here in the HTML (they are identical in both languages). GitHub/LinkedIn
             open in a new tab and announce it; email is a same-tab, parameter-free
             mailto. -->
        <ul class="contact__list">
          <li class="contact__item" data-reveal>
            <span class="contact__label" data-i18n="contact.githubLabel"></span>
            <a class="contact__value" href="https://github.com/Khalil-bec" target="_blank" rel="noopener noreferrer">https://github.com/Khalil-bec<span class="visually-hidden" data-i18n="a11y.newTab"></span></a>
          </li>
          <li class="contact__item" data-reveal>
            <span class="contact__label" data-i18n="contact.emailLabel"></span>
            <a class="contact__value contact__value--email" href="mailto:khalil.becheikh54@gmail.com">khalil.becheikh54@gmail.com</a>
          </li>
          <li class="contact__item" data-reveal>
            <span class="contact__label" data-i18n="contact.linkedinLabel"></span>
            <a class="contact__value" href="https://www.linkedin.com/in/becheikh-mohamed-khalil/" target="_blank" rel="noopener noreferrer">https://www.linkedin.com/in/becheikh-mohamed-khalil/<span class="visually-hidden" data-i18n="a11y.newTab"></span></a>
          </li>
          <li class="contact__item" data-reveal>
            <span class="contact__label" data-i18n="contact.locationLabel"></span>
            <span class="contact__value" data-i18n="contact.location"></span>
          </li>
        </ul>
      </section>
    </main>

    <!--
      Ruler: document-space scale + readout + driver (tickets 102, 109, 110;
      exact-scale form since 113). Fixed overlay in the outer right-edge lane:
      a scale as tall as the page that slides 1:1 with the scroll past this
      fixed window (graduations every 1% of the document, numbered grades every
      5%), and a blue 1px rule that travels with the depth while the readout —
      three rolling digit drums + `%` — hangs 4px below it and flips above it at
      the travel's end (measured on the inspiration). The lane itself is
      the slider (whole-lane drag, keys handled by the scroll driver); the
      grades and the digits are chrome, aria-hidden. The grades are built by
      src/ruler/ruler.js (chrome, not copy), so the scale and the readout ship
      empty. The pinned 0/100 bounds of ticket 110 retired in 113 (the travelling
      readout carries the exact value, as on the inspiration).
    -->
    <div class="ruler" data-ruler role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-attr="aria-label=ruler.aria" aria-label="">
      <div class="ruler__track" data-ruler-track>
        <div class="ruler__scale" data-ruler-scale aria-hidden="true"></div>
        <div class="ruler__marker" data-ruler-marker aria-hidden="true">
          <span class="ruler__readout" data-ruler-readout></span>
        </div>
      </div>
    </div>

    <!-- Vendor classic scripts (UMD globals), deferred; then the module entry. -->
    <script defer src="vendor/gsap-3.15.0.min.js"></script>
    <script defer src="vendor/ScrollTrigger-3.15.0.min.js"></script>
    <script defer src="vendor/lenis-1.3.27.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
